project:
  name: "cifar10_resnet50"
  seed: 42
  device: "auto"  # auto, cpu, cuda, mps
  output_dir: "results"

data:
  dataset: "cifar10"
  data_dir: "data"
  num_workers: 4
  pin_memory: true

  custom:
    num_classes: 10
    image_size: 224

  train:
    batch_size: 128
    shuffle: true
    drop_last: true

  val:
    batch_size: 256
    shuffle: false
    drop_last: false

  # Long-tail imbalance (training set only)
  imbalance:
    enabled: true
    ratio: 20    # max_class / min_class

  # Imbalanced data strategies
  weighted_sampling: true   # WeightedRandomSampler
  weighted_loss: true       # inverse-freq class weights

  augmentation:
    random_crop: true
    random_horizontal_flip: true
    color_jitter: false
    random_erasing: false
    normalize: true

model:
  name: "resnet50"
  pretrained: false
  num_classes: 10
  dropout: 0.0

training:
  epochs: 20
  gradient_clip: 0.0

  optimizer:
    name: "adam"
    lr: 0.001
    weight_decay: 0.0001
    momentum: 0.9
    nesterov: true

  scheduler:
    name: "cosine"
    step_size: 30
    gamma: 0.1
    T_max: 20
    eta_min: 0.00001
    patience: 10
    factor: 0.1

  early_stopping:
    enabled: true
    patience: 10
    metric: "val_acc"
    mode: "max"

logging:
  log_interval: 50
  save_interval: 5
  tensorboard: false
  wandb: false
  wandb_project: "image_classification"
